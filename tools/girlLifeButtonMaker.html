<head>

    <title>Centered Button with Overlayed Image</title>

    /* General styles */
body {
    display: flex;
    height: 100vh;
    margin: 0;
    background-color: #000;
    color: #fff;
}

/* Controls section */
.controls {
    padding: 15px;
    background-color: #333333;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.control-section {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 40px;
}

/* Input styles */
input, select, textarea {
    height: 30px;
    background-color: #333;
    color: #ffffff;
    border: 1px solid #444;
    padding: 0 5px;
    box-sizing: border-box;
    font-size: medium;
}

input[type="range"] {
    background-color: #444;
}

/* Color input styles */
input[type="color"] {
    padding: 0;
    height: 30px;
    border: 3px solid #444;
    -webkit-appearance: none;
    appearance: none;
}

input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
}

input[type="color"]::-webkit-color-swatch {
    border: none;
}

/* Label styles */
label {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 100%;
    margin: 0;
    font-size: 20px;
}

/* Checkbox container */
.checkbox-container {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 30px;
}

/* Main content area */
.main-content {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #000;
    flex-direction: column;
}

/* Overlay container */
.overlay-container {
    position: relative;
    width: 75px;
    height: 75px;
    margin-bottom: 20px;
}

/* Button styles */
.button {
    background: radial-gradient(ellipse at 10% 0%, lightpink 60%, deeppink 61%);
    border: none;
    color: white;
    width: 75px;
    height: 75px;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    cursor: pointer;
    border-radius: 28px;
    font-family: 'BioRhyme', serif;
    appearance: none;
}

.button.zoom-2x {
    transform: scale(2);
}

.button.zoom-3x {
    transform: scale(3);
}

/* Color sample */
.color-sample {
    width: 20px;
    height: 20px;
    display: inline-block;
    border: 1px solid #000;
    margin-left: 10px;
}

/* Modal styles */
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
}

.modal-content {
    background-color: #333333;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #333;
    width: 350px; /* Adjusted width to accommodate the small image and some padding */
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center; /* Center content horizontally */
}

#imageContainer {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 75px;
    height: 75px;
    margin-bottom: 20px; /* Space between image and controls */
}

#imageContainer img,
#imageContainer svg {
    width: 75px;
    height: 75px;
    object-fit: contain; /* Ensure the entire image is visible */
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover,
.close:focus {
    color: #ffffff;
    text-decoration: none;
}

/* Button styles */
#showPngButton,
#downloadPngButton {
    background-color: lightgray;
    color: #000;
    border: none;
    padding: 5px;
    font-size: 20px;
    border-radius: 0;
    cursor: pointer;
    margin-top: 5px;
    height: 30px;
    font-weight: 900;
    margin-top: 60px;
}


#zoomButton {
    background-color: lightgray;
    color: #000;
    border: none;
    padding: 0;
    font-size: 20px;
    border-radius: 0;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin-left: 10px;
    height: 30px;
    width: 30px;
    font-weight: 900;
}

#buttonText {
    position: absolute;
    transform: translate(-50%, -50%);
    left: 50%;
    top: 50%;
}

/* Ensure modal elements have consistent styling */
.modal input,
.modal select,
.modal label {
    background-color: #333;
    color: #ffffff;
    border: 1px solid #444;
}

.modal select option {
    background-color: inherit;
    color: inherit;
}
    </style>
</head>

    function updateShadow() {
        const hOffset = document.getElementById('shadowHorizontal').value;
        const vOffset = document.getElementById('shadowVertical').value;
        const blur = document.getElementById('shadowBlur').value;
        const color = document.getElementById('shadowColor').value;
        const opacity = document.getElementById('shadowOpacity').value;
        const boxShadow = `inset ${hOffset}px ${vOffset}px ${blur}px rgba(${hexToRgb(color)}, ${opacity})`;
        document.getElementById('toggleButton').style.boxShadow = boxShadow;
    }

    function hexToRgb(hex) {
        const bigint = parseInt(hex.slice(1), 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return `${r}, ${g}, ${b}`;
    }

    function getBrightness(rgb) {
        // Calculate the brightness of the color
        return (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
    }

    function updateBorderColor(input) {
        var color = input.value;
        var rgb = hexToRgb(color);
        var brightness = getBrightness(rgb);
        var borderColor = brightness > 128 ? '#333333' : '#cccccc'; // Dark gray for light colors, light gray for dark colors
        input.style.borderColor = borderColor;
    }

    // When the user clicks the button, open the modal
    document.getElementById('showPngButton').addEventListener('click', function() {
        htmlToImage.toPng(document.getElementById('toggleButton'), { backgroundColor: null })
            .then(function(dataUrl) {
                // Set the image source to the PNG data URL
                var imageContainer = document.getElementById('imageContainer');
                imageContainer.innerHTML = `<img src="${dataUrl}" alt="Toggle Button Image">`;

                // Open the modal
                var modal = document.getElementById('myModal'); // Correctly reference the modal element
                modal.style.display = "block";
            })
            .catch(function(error) {
                console.error('oops, something went wrong!', error);
            });
    });

    document.getElementById('downloadPngButton').addEventListener('click', function() {
        htmlToImage.toPng(document.getElementById('toggleButton'), { backgroundColor: null })
            .then(function(dataUrl) {
                // Create a link element and trigger download
                var link = document.createElement('a');
                link.href = dataUrl;
                link.download = 'button.png';
                link.click();
            })
            .catch(function(error) {
                console.error('oops, something went wrong!', error);
            });
    });


    // When the user clicks on <span> (x), close the modal
    span.onclick = function() {
        modal.style.display = "none";
    }

    // When the user clicks anywhere outside of the modal, close it
    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
